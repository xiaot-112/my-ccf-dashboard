name: Sync CCF Deadlines

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml requests

      - name: Generate JSON
        run: |
          python3 << 'PYEOF'
          import yaml, json, requests, re, os
          from datetime import datetime, timezone, timedelta

          CATEGORIES = {
              'AI': '人工智能', 'CG': '计算机图形学与多媒体',
              'DB': '数据库/数据挖掘', 'HI': '人机交互与普适计算',
              'MX': '交叉/综合/新兴', 'NW': '计算机网络',
              'SC': '计算机体系结构/并行与分布计算/存储系统',
              'SE': '软件工程/系统软件/程序设计语言',
              'SP': '网络与信息安全', 'TC': '计算机科学理论'
          }

          API_BASE = "https://api.github.com/repos/ccfddl/ccf-deadlines/contents/conference"

          def fetch(url):
              resp = requests.get(url, headers={'Accept': 'application/vnd.github.v3+json'}, timeout=30)
              resp.raise_for_status()
              return resp

          all_confs = []
          
          # 获取目录
          dirs = fetch(API_BASE).json()
          
          for d in [x for x in dirs if x.get('type')=='dir' and x['name'] in CATEGORIES]:
              cat = d['name']
              files = fetch(f"{API_BASE}/{cat}").json()
              
              for f in [x for x in files if x['name'].endswith('.yml')]:
                  text = fetch(f['download_url']).text
                  
                  # 解析
                  title = re.search(r'title:\s*(.+)', text)
                  desc = re.search(r'description:\s*(.+)', text)
                  ccf = re.search(r'ccf:\s*([A-C]|N)', text)
                  
                  years = re.findall(r'year:\s*(\d+)', text)
                  deadlines = re.findall(r'deadline:\s*[\'"]?(.+?)[\'"]?$', text, re.M)
                  dates = re.findall(r'date:\s*(.+)', text)
                  places = re.findall(r'place:\s*(.+)', text)
                  links = re.findall(r'link:\s*(.+)', text)
                  
                  for i, y in enumerate(years):
                      if i >= len(deadlines): continue
                      
                      dt_match = re.match(r'(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})', deadlines[i])
                      if dt_match:
                          y_, m, d, h, mi, s = map(int, dt_match.groups())
                          dt = datetime(y_, m, d, h, mi, s, tzinfo=timezone.utc) + timedelta(hours=12)
                          iso = dt.isoformat()
                      else:
                          iso = deadlines[i]
                      
                      all_confs.append({
                          'id': f"{title.group(1).strip().lower().replace(' ', '-')}-{y}" if title else f"conf-{y}",
                          'title': title.group(1).strip() if title else '',
                          'description': desc.group(1).strip() if desc else '',
                          'category': cat,
                          'category_name': CATEGORIES[cat],
                          'year': int(y),
                          'deadline': iso,
                          'date': dates[i] if i < len(dates) else '',
                          'place': places[i] if i < len(places) else '',
                          'link': links[i] if i < len(links) else '',
                          'rank': {'ccf': ccf.group(1) if ccf else ''}
                      })

          # 过滤未来截稿
          now = datetime.now(timezone.utc)
          upcoming = [c for c in all_confs if datetime.fromisoformat(c['deadline'].replace('Z','+00:00')) > now]
          upcoming.sort(key=lambda x: x['deadline'])

          os.makedirs('dist', exist_ok=True)
          
          with open('dist/deadlines.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'meta': {
                      'generated_at': now.isoformat(),
                      'total': len(all_confs),
                      'upcoming': len(upcoming)
                  },
                  'conferences': upcoming
              }, f, ensure_ascii=False, indent=2)

          print(f"Generated: {len(upcoming)} upcoming conferences")
          PYEOF

      # 使用 peaceiris/actions-gh-pages 部署（最稳定）
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
