name: Sync CCF Deadlines

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml requests

      - name: Generate deadlines JSON
        run: |
          python3 << 'PYEOF'
          import yaml
          import json
          import requests
          import os
          import re
          from datetime import datetime, timezone, timedelta

          # ========== 完整分类映射（10个，根据实际仓库） ==========
          CATEGORIES = {
              'AI': '人工智能',
              'CG': '计算机图形学与多媒体',
              'CT': '计算机科学理论',
              'DB': '数据库/数据挖掘/内容检索',
              'DS': '计算机体系结构/并行与分布计算/存储系统',
              'HI': '人机交互与普适计算',
              'MX': '交叉/综合/新兴',
              'NW': '计算机网络',
              'SC': '计算机系统/高性能计算',
              'SE': '软件工程/系统软件/程序设计语言'
          }

          API_BASE = "https://api.github.com/repos/ccfddl/ccf-deadlines/contents/conference"

          def fetch(url, retries=3):
              headers = {
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'CCF-Deadlines-Sync'
              }
              for i in range(retries):
                  try:
                      resp = requests.get(url, headers=headers, timeout=30)
                      resp.raise_for_status()
                      return resp
                  except Exception as e:
                      if i == retries - 1:
                          raise e
                      import time
                      time.sleep(2 ** i)

          def extract_year_from_date(date_str):
              """从 date 字段提取年份，如 'February 22 - March 1, 2022' -> 2022"""
              if not date_str:
                  return None
              # 匹配最后的 4 位数字年份
              match = re.search(r'(\d{4})\s*$', date_str)
              if match:
                  return int(match.group(1))
              return None

          def convert_to_utc8(deadline_str, tz_str):
              """将 deadline 转换为 UTC+8 (北京时间)"""
              if not deadline_str or deadline_str == 'TBD':
                  return None
              
              try:
                  dt = datetime.strptime(deadline_str, '%Y-%m-%d %H:%M:%S')
              except ValueError:
                  return None
              
              # 解析时区偏移
              tz_offset = -12  # 默认 UTC-12 (AoE)
              if tz_str:
                  if tz_str == 'AoE':
                      tz_offset = -12
                  elif tz_str.startswith('UTC'):
                      try:
                          tz_offset = int(tz_str[3:])
                      except:
                          pass
              
              # 创建带原始时区的时间
              original_tz = timezone(timedelta(hours=tz_offset))
              original_dt = dt.replace(tzinfo=original_tz)
              
              # 转为 UTC+8 (北京时间)
              cn_tz = timezone(timedelta(hours=8))
              cn_dt = original_dt.astimezone(cn_tz)
              
              return cn_dt.isoformat()

          def parse_yaml_file(text, category):
              """使用 PyYAML 正确解析 YAML 文件"""
              try:
                  data = yaml.safe_load(text)
              except Exception as e:
                  print(f"    ⚠️ YAML parse error: {e}")
                  return []
              
              if not data or not isinstance(data, dict):
                  return []
              
              title = data.get('title', '')
              description = data.get('description', '')
              rank = data.get('rank', {})
              dblp = data.get('dblp', '')
              
              conferences = []
              
              confs = data.get('confs', [])
              if not isinstance(confs, list):
                  return []
              
              for conf in confs:
                  if not isinstance(conf, dict):
                      continue
                  
                  year = conf.get('year')
                  if not year:
                      continue
                  
                  # 获取会议基本信息
                  conf_id = conf.get('id', f"{title.lower().replace(' ', '-')}-{year}" if title else f"conf-{year}")
                  link = conf.get('link', '')
                  date_str = conf.get('date', '')
                  place = conf.get('place', '')
                  conf_timezone = conf.get('timezone', 'UTC-12')
                  
                  # 从 date 字段提取会议召开年份
                  conference_year = extract_year_from_date(date_str) or year
                  
                  # 处理 timeline
                  timeline = conf.get('timeline', [])
                  if not isinstance(timeline, list):
                      if isinstance(timeline, dict):
                          timeline = [timeline]
                      else:
                          continue
                  
                  for entry in timeline:
                      if not isinstance(entry, dict):
                          continue
                      
                      deadline_str = entry.get('deadline')
                      if not deadline_str:
                          continue
                      
                      abstract_str = entry.get('abstract_deadline')
                      comment = entry.get('comment', '')
                      tz = entry.get('timezone', conf_timezone)
                      
                      # 转换 deadline 为 UTC+8
                      deadline_iso = convert_to_utc8(deadline_str, tz)
                      if not deadline_iso:
                          continue
                      
                      # 转换 abstract deadline
                      abstract_iso = None
                      if abstract_str:
                          abstract_iso = convert_to_utc8(abstract_str, tz)
                      
                      conferences.append({
                          'id': f"{conf_id}-{len(conferences)}" if len(timeline) > 1 else conf_id,
                          'title': title,
                          'description': description,
                          'category': category,
                          'category_name': CATEGORIES.get(category, category),
                          'year': year,
                          'conference_year': conference_year,  # 会议召开年份
                          'deadline': deadline_iso,
                          'deadline_raw': deadline_str,
                          'abstract_deadline': abstract_iso,
                          'abstract_deadline_raw': abstract_str,
                          'comment': comment,
                          'date': date_str,
                          'place': place,
                          'link': link,
                          'timezone': tz,
                          'rank': rank,
                          'dblp': dblp
                      })
              
              return conferences

          # ========== 主程序 ==========
          print("🚀 Starting CCF deadlines sync...")
          all_conferences = []
          stats = {cat: 0 for cat in CATEGORIES.keys()}
          parse_errors = []

          # 获取所有目录
          dirs = fetch(API_BASE).json()
          valid_dirs = [d for d in dirs if d.get('type') == 'dir' and d['name'] in CATEGORIES]

          print(f"📂 Found {len(valid_dirs)} valid categories out of {len(CATEGORIES)} total")
          print(f"   Categories: {sorted([d['name'] for d in valid_dirs])}")

          for dir_info in valid_dirs:
              cat = dir_info['name']
              files = fetch(f"{API_BASE}/{cat}").json()
              yml_files = [f for f in files if f.get('name', '').endswith('.yml')]
              
              print(f"\n📁 {cat} ({CATEGORIES[cat]}): {len(yml_files)} files")
              
              for file_info in yml_files:
                  try:
                      yaml_text = fetch(file_info['download_url']).text
                      conferences = parse_yaml_file(yaml_text, cat)
                      
                      if conferences:
                          all_conferences.extend(conferences)
                          stats[cat] += len(conferences)
                          print(f"   ✅ {file_info['name']}: {len(conferences)} conferences")
                      else:
                          print(f"   ⚠️ {file_info['name']}: no conferences parsed")
                          
                  except Exception as e:
                      parse_errors.append(f"{cat}/{file_info['name']}: {e}")
                      print(f"   ❌ {file_info['name']}: {e}")

          # ========== 过滤逻辑 ==========
          # 保留当前年份（2026）及以后召开的会议
          current_year = datetime.now().year  # 2026
          
          filtered = []
          for conf in all_conferences:
              conf_year = conf.get('conference_year') or conf.get('year')
              if conf_year and conf_year >= current_year:
                  filtered.append(conf)

          # 按截稿时间排序
          filtered.sort(key=lambda x: x['deadline'])

          # 输出统计
          print(f"\n{'='*60}")
          print(f"📊 STATISTICS")
          print(f"{'='*60}")
          print(f"Total parsed:     {len(all_conferences)}")
          print(f"Filtered (>{=current_year}): {len(filtered)}")
          print(f"Parse errors:     {len(parse_errors)}")
          print(f"\nBy category:")
          for cat, count in sorted(stats.items()):
              if count > 0:
                  print(f"  {cat:3s} ({CATEGORIES[cat][:25]:25s}): {count:3d}")
          
          if parse_errors:
              print(f"\n⚠️ Parse errors ({len(parse_errors)}):")
              for err in parse_errors[:10]:
                  print(f"  {err}")

          # 写入文件
          os.makedirs('dist', exist_ok=True)
          
          output = {
              'meta': {
                  'generated_at': datetime.now(timezone.utc).isoformat(),
                  'total_conferences': len(all_conferences),
                  'upcoming_count': len(filtered),
                  'current_year': current_year,
                  'categories': list(CATEGORIES.keys()),
                  'category_names': CATEGORIES,
                  'source': 'https://github.com/ccfddl/ccf-deadlines'
              },
              'conferences': filtered
          }

          with open('dist/deadlines.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"\n✅ Output: dist/deadlines.json ({len(filtered)} conferences)")
          PYEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Update deadlines [skip ci]"
