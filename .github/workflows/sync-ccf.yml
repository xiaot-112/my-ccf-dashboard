name: Sync CCF Deadlines

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml requests

      - name: Generate deadlines JSON
        run: |
          python3 << 'PYEOF'
          import yaml
          import json
          import requests
          import re
          import os
          from datetime import datetime, timezone, timedelta

          # ========== 完整分类映射（12个） ==========
          CATEGORIES = {
              'AI': '人工智能',
              'CG': '计算机图形学与多媒体',
              'CT': '计算机科学理论',
              'DB': '数据库/数据挖掘/内容检索',
              'DS': '计算机体系结构/并行与分布计算/存储系统',
              'HI': '人机交互与普适计算',
              'MX': '交叉/综合/新兴',
              'NW': '计算机网络',
              'SC': '计算机系统/高性能计算',
              'SE': '软件工程/系统软件/程序设计语言',
              'SP': '网络与信息安全',
              'TC': '计算机科学理论'
          }

          API_BASE = "https://api.github.com/repos/ccfddl/ccf-deadlines/contents/conference"

          def fetch(url, retries=3):
              headers = {
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'CCF-Deadlines-Sync'
              }
              for i in range(retries):
                  try:
                      resp = requests.get(url, headers=headers, timeout=30)
                      resp.raise_for_status()
                      return resp
                  except Exception as e:
                      if i == retries - 1:
                          raise e
                      import time
                      time.sleep(2 ** i)

          def parse_deadline_to_iso(deadline_str, tz_str):
              """将 deadline 字符串转换为各时区的 ISO 格式"""
              if not deadline_str or deadline_str == 'TBD':
                  return None
              
              # 解析时间字符串
              dt_match = re.match(r'(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})', deadline_str)
              if not dt_match:
                  return None
              
              y, m, d, h, mi, s = map(int, dt_match.groups())
              
              # 解析时区偏移
              tz_offset = 0
              if tz_str:
                  tz_match = re.match(r'UTC([+-]\d+)', tz_str)
                  if tz_match:
                      tz_offset = int(tz_match.group(1))
                  elif tz_str == 'AoE':
                      tz_offset = -12  # Anywhere on Earth = UTC-12
              
              # 创建带原始时区的时间
              original_tz = timezone(timedelta(hours=tz_offset))
              original_dt = datetime(y, m, d, h, mi, s, tzinfo=original_tz)
              
              # 转为 UTC
              utc_dt = original_dt.astimezone(timezone.utc)
              
              # 转为 UTC+8 (北京时间)
              cn_tz = timezone(timedelta(hours=8))
              cn_dt = original_dt.astimezone(cn_tz)
              
              return {
                  'raw': deadline_str,
                  'timezone': tz_str or 'UTC-12',
                  'original': original_dt.isoformat(),
                  'utc': utc_dt.isoformat(),
                  'utc_plus_8': cn_dt.isoformat()
              }

          def parse_yaml(text, category):
              """解析 YAML 文件，返回会议列表"""
              title_match = re.search(r'^title:\s*(.+)$', text, re.MULTILINE)
              title = title_match.group(1).strip() if title_match else ''
              
              desc_match = re.search(r'^description:\s*(.+)$', text, re.MULTILINE)
              description = desc_match.group(1).strip() if desc_match else ''
              
              ccf_match = re.search(r'^ccf:\s*([A-C]|N)$', text, re.MULTILINE)
              core_match = re.search(r'^core:\s*([A-C]\*?)$', text, re.MULTILINE)
              thcpl_match = re.search(r'^thcpl:\s*([A-C])$', text, re.MULTILINE)
              dblp_match = re.search(r'^dblp:\s*(\w+)$', text, re.MULTILINE)
              
              conferences = []
              
              # 匹配 confs 数组中的每个条目
              # 先找到 confs: 后面的所有内容
              confs_match = re.search(r'confs:\s*(.*?)(?=\n\w+:|$)', text, re.DOTALL)
              if not confs_match:
                  return conferences
              
              confs_text = confs_match.group(1)
              
              # 按 year 分割每个会议条目
              year_blocks = re.split(r'(?=\n\s*-\s*year:)', confs_text)
              
              for block in year_blocks:
                  if not block.strip() or 'year:' not in block:
                      continue
                  
                  year_match = re.search(r'year:\s*(\d+)', block)
                  if not year_match:
                      continue
                  year = int(year_match.group(1))
                  
                  # 提取 date
                  date_match = re.search(r'date:\s*(.+)', block)
                  date_str = date_match.group(1).strip() if date_match else ''
                  
                  # 提取 place
                  place_match = re.search(r'place:\s*(.+)', block)
                  place_str = place_match.group(1).strip() if place_match else ''
                  
                  # 提取 link
                  link_match = re.search(r'link:\s*(.+)', block)
                  link_str = link_match.group(1).strip() if link_match else ''
                  
                  # 提取 timezone（会议级别的默认时区）
                  tz_match = re.search(r'timezone:\s*(.+)', block)
                  default_tz = tz_match.group(1).strip() if tz_match else 'UTC-12'
                  
                  # 提取 timeline 数组
                  timeline_match = re.search(r'timeline:\s*(.*?)(?=\n\s*\w+:|$)', block, re.DOTALL)
                  if not timeline_match:
                      continue
                  
                  timeline_text = timeline_match.group(1)
                  
                  # 分割每个 timeline 条目
                  timeline_entries = re.split(r'(?=\n\s*-\s*(?:abstract_deadline|deadline|comment):)', timeline_text)
                  
                  for entry in timeline_entries:
                      if not entry.strip():
                          continue
                      
                      # 提取 abstract_deadline
                      abs_match = re.search(r'abstract_deadline:\s*[\'"]?(.+?)[\'"]?$', entry, re.MULTILINE)
                      abs_str = abs_match.group(1).strip() if abs_match else None
                      
                      # 提取 deadline
                      dl_match = re.search(r'deadline:\s*[\'"]?(.+?)[\'"]?$', entry, re.MULTILINE)
                      if not dl_match:
                          continue
                      dl_str = dl_match.group(1).strip()
                      
                      # 提取 comment
                      comment_match = re.search(r'comment:\s*(.+)', entry)
                      comment_str = comment_match.group(1).strip() if comment_match else ''
                      
                      # 解析 deadline 时间
                      deadline_info = parse_deadline_to_iso(dl_str, default_tz)
                      if not deadline_info:
                          continue
                      
                      # 解析 abstract deadline
                      abs_info = None
                      if abs_str:
                          abs_info = parse_deadline_to_iso(abs_str, default_tz)
                      
                      conf_id = f"{title.lower().replace(' ', '-')}-{year}" if title else f"conf-{year}"
                      
                      conferences.append({
                          'id': conf_id,
                          'title': title,
                          'description': description,
                          'category': category,
                          'category_name': CATEGORIES.get(category, category),
                          'year': year,
                          'deadline': deadline_info,
                          'abstract_deadline': abs_info,
                          'comment': comment_str,
                          'date': date_str,
                          'place': place_str,
                          'link': link_str,
                          'rank': {
                              'ccf': ccf_match.group(1) if ccf_match else '',
                              'core': core_match.group(1) if core_match else '',
                              'thcpl': thcpl_match.group(1) if thcpl_match else '',
                          },
                          'dblp': dblp_match.group(1) if dblp_match else ''
                      })
              
              return conferences

          # ========== 主程序 ==========
          print("🚀 Starting CCF deadlines sync...")
          all_conferences = []
          stats = {cat: 0 for cat in CATEGORIES.keys()}
          parse_errors = []

          # 获取所有目录
          dirs = fetch(API_BASE).json()
          valid_dirs = [d for d in dirs if d.get('type') == 'dir' and d['name'] in CATEGORIES]

          print(f"📂 Found {len(valid_dirs)} valid categories out of {len(CATEGORIES)} total")
          print(f"   Categories: {sorted([d['name'] for d in valid_dirs])}")

          for dir_info in valid_dirs:
              cat = dir_info['name']
              files = fetch(f"{API_BASE}/{cat}").json()
              yml_files = [f for f in files if f.get('name', '').endswith('.yml')]
              
              print(f"\n📁 {cat} ({CATEGORIES[cat]}): {len(yml_files)} files")
              
              for file_info in yml_files:
                  try:
                      yaml_text = fetch(file_info['download_url']).text
                      conferences = parse_yaml(yaml_text, cat)
                      
                      if conferences:
                          all_conferences.extend(conferences)
                          stats[cat] += len(conferences)
                          print(f"   ✅ {file_info['name']}: {len(conferences)} conferences")
                      else:
                          print(f"   ⚠️ {file_info['name']}: no conferences parsed")
                          
                  except Exception as e:
                      parse_errors.append(f"{cat}/{file_info['name']}: {e}")
                      print(f"   ❌ {file_info['name']}: {e}")

          # 过滤未来截稿的会议
          now = datetime.now(timezone.utc)
          upcoming = []
          for conf in all_conferences:
              try:
                  deadline_utc = datetime.fromisoformat(conf['deadline']['utc'])
                  if deadline_utc > now:
                      upcoming.append(conf)
              except Exception as e:
                  print(f"Warning: Could not parse deadline for {conf['id']}: {e}")
                  upcoming.append(conf)  # 解析失败也保留

          upcoming.sort(key=lambda x: x['deadline']['utc'])

          # 输出统计
          print(f"\n{'='*60}")
          print(f"📊 STATISTICS")
          print(f"{'='*60}")
          print(f"Total parsed:     {len(all_conferences)}")
          print(f"Upcoming:         {len(upcoming)}")
          print(f"Parse errors:     {len(parse_errors)}")
          print(f"\nBy category:")
          for cat, count in sorted(stats.items()):
              if count > 0:
                  print(f"  {cat:3s} ({CATEGORIES[cat][:20]:20s}): {count:3d}")
          
          if parse_errors:
              print(f"\n⚠️ Parse errors ({len(parse_errors)}):")
              for err in parse_errors[:10]:
                  print(f"  {err}")

          # 写入文件
          os.makedirs('dist', exist_ok=True)
          
          output = {
              'meta': {
                  'generated_at': now.isoformat(),
                  'total_conferences': len(all_conferences),
                  'upcoming_count': len(upcoming),
                  'categories': CATEGORIES,
                  'source': 'https://github.com/ccfddl/ccf-deadlines'
              },
              'conferences': upcoming
          }

          with open('dist/deadlines.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"\n✅ Output: dist/deadlines.json ({len(upcoming)} upcoming conferences)")
          PYEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Update deadlines [skip ci]"
